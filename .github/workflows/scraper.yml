name: News Scraper

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর রান করার জন্য
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য অপশন

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node index.js
